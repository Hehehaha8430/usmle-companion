<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F5F4">
<title>Dr. Shank Step 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Design tokens
   ink      #17233C  navy from the video course: text, masthead
   linen    #F2F5F4  cool clinical page
   sheet    #FFFFFF  case sheet and lists
   scrub    #2C6E68  teal: primary action, correct answers
   coral    #C1443B  video red: wrong answers, traps, the title rule
   rule     #D9E1E3  lines
   quiet    #5D6B7E  secondary text (AA on linen and sheet)
   marker   #F7E39A  highlighter, drawn as a pen stroke under the words */
:root{
  --ink:#17233C;--page:#F2F5F4;--sheet:#FFFFFF;--scrub:#2C6E68;--scrub-t:#E3F0EE;--coral:#C1443B;--coral-t:#FBEAE8;
  --rule:#D9E1E3;--quiet:#5D6B7E;--tint:#EAF0EF;--marker:#F7E39A;
  --serif:"Source Serif 4",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif;--read:var(--serif);
  --ease:cubic-bezier(.2,.8,.2,1);--t:1;--tabs:62px;--rail:0px;
}
html[data-theme="night"]{--ink:#E7ECF4;--page:#0F1626;--sheet:#152038;--scrub:#6CC2B6;--scrub-t:#17363A;--coral:#F08B80;--coral-t:#3A1F27;--rule:#26334F;--quiet:#9AA8BE;--tint:#1B2843;--marker:#6B5A1E}
html[data-theme="sepia"]{--ink:#33291D;--page:#F3ECDD;--sheet:#FBF7EE;--scrub:#2F6A5A;--scrub-t:#E2EADC;--coral:#A83C2E;--coral-t:#F4E1D8;--rule:#E2D7C3;--quiet:#6F604C;--tint:#EEE5D3;--marker:#EFD27E}
html[data-font="sans"]{--read:var(--sans)}
html[data-font="easy"]{--read:"Atkinson Hyperlegible",sans-serif;--sans:"Atkinson Hyperlegible",sans-serif}
html[data-motion="off"]{--t:0}
html{font-size:calc(16px*var(--scale,1));-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px;border-radius:4px}
a{color:var(--scrub)}

/* shell */
.app{min-height:100vh;padding-bottom:calc(var(--tabs) + env(safe-area-inset-bottom))}
.main{max-width:44rem;margin:0 auto;padding:0 1.25rem 3rem}
.mast{display:flex;align-items:center;justify-content:space-between;padding:1rem 0 .7rem;border-bottom:3px double var(--ink)}
.word{font:700 1.05rem var(--serif);letter-spacing:-.01em}
.word span{font:500 .82rem var(--sans);color:var(--quiet);margin-left:.5rem}
.iconbtn{width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--tint)}
.iconbtn svg{width:1.2rem;height:1.2rem}
h1{font:700 2.1rem/1.15 var(--serif);letter-spacing:-.015em;margin:1.6rem 0 0}
h1+.rulebar{width:3rem;height:3px;background:var(--coral);margin:.7rem 0 0}
.lede{color:var(--quiet);margin:.6rem 0 0}
h2{font:600 1.15rem var(--serif);margin:2.4rem 0 .4rem}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;height:calc(var(--tabs) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--sheet);border-top:1px solid var(--rule);display:flex;transition:transform calc(.3s*var(--t)) var(--ease)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.18rem;font:500 .7rem var(--sans);color:var(--quiet);cursor:pointer}
.tab svg{width:1.3rem;height:1.3rem}
.tab.on{color:var(--ink);font-weight:600}.tab.on svg{color:var(--scrub)}
.tab[disabled]{opacity:.45;cursor:default}
.side{display:none}
body.focus .tabs{transform:translateY(110%)}
@media(min-width:1100px){
  :root{--tabs:0px;--rail:15rem}
  .app{padding-left:var(--rail)}
  .tabs{inset:0 auto 0 0;width:var(--rail);height:100vh;flex-direction:column;justify-content:flex-start;padding:1.2rem 1rem;border-top:0;border-right:1px solid var(--rule);gap:.15rem}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:.75rem;padding:.6rem .75rem;border-radius:8px;font-size:.92rem}
  .tab:not([disabled]):hover{background:var(--tint)}
  .tab.on{background:var(--tint)}
  .side{display:block;padding:.2rem .75rem 1rem;margin-bottom:.6rem;border-bottom:3px double var(--ink)}
  .side b{display:block;font:700 1.15rem var(--serif)}.side span{font-size:.8rem;color:var(--quiet)}
  body.focus .tabs{transform:translateX(-101%)}body.focus .app{padding-left:0}
  .mast .word{visibility:hidden}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;white-space:nowrap;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.62rem 1rem;font:600 .93rem var(--sans);cursor:pointer;transition:background .15s,border-color .15s,transform calc(.12s*var(--t))}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--scrub);border-color:var(--scrub);color:#fff}
html[data-theme="night"] .btn.go{color:#0F1626}
.btn.go:hover{filter:brightness(1.08)}
.btn.text{border-color:transparent;background:none;color:var(--scrub);padding-left:.2rem;padding-right:.2rem}
.btn.text:hover{text-decoration:underline}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}

/* Today */
.date{color:var(--quiet);margin-top:1.6rem;font-size:.92rem}
.date+h1{margin-top:.2rem}
.plan{margin-top:1.6rem;padding:1.4rem 1.4rem 1.3rem;background:var(--sheet);border-radius:10px;border-left:4px solid var(--scrub)}
.plan p.big{font:600 1.55rem/1.25 var(--serif);margin:0}
.plan p.sm{color:var(--quiet);margin:.35rem 0 1.1rem}
.track{height:5px;background:var(--tint);border-radius:3px;overflow:hidden;margin-top:1.2rem}
.track i{display:block;height:100%;background:var(--scrub);border-radius:3px;transition:width calc(.8s*var(--t)) var(--ease)}
.trackcap{display:flex;justify-content:space-between;font-size:.82rem;color:var(--quiet);margin-top:.45rem}
.exam{display:flex;align-items:baseline;gap:.5rem;margin-top:1rem;font-size:.95rem}
.exam b{font:700 1.3rem var(--serif)}
.list{background:var(--sheet);border-radius:10px;padding:0 1.1rem}
.li{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.85rem 0;border-top:1px solid var(--rule)}
.li:first-child{border-top:0}
.li .t{font-weight:600}.li .s{font-size:.85rem;color:var(--quiet);margin-top:.1rem}
.li .acc{font:600 .9rem var(--sans);color:var(--coral);min-width:3rem;text-align:right}
.empty{color:var(--quiet);font-size:.92rem;padding:1rem 0}
.li.tap{cursor:pointer}.li.tap:hover .t{color:var(--scrub)}

/* Practice */
.filters{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.4rem}
.drop{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.42rem .8rem;font:500 .88rem var(--sans);cursor:pointer}
.drop b{font-weight:600}
.drop.set{border-color:var(--scrub);background:var(--scrub-t)}
.drop svg{width:.85rem;height:.85rem;color:var(--quiet)}
.series{margin-top:1.2rem;background:var(--sheet);border-radius:10px}
.srow{display:grid;grid-template-columns:3rem 1fr auto;gap:1rem;align-items:center;padding:1rem 1.1rem;border-top:1px solid var(--rule);cursor:pointer}
.srow:first-child{border-top:0}
.srow:hover h3{color:var(--scrub)}
.srow .gl{width:3rem;height:3rem;border-radius:50%;background:var(--tint);display:grid;place-items:center;font:600 .8rem var(--sans);color:var(--scrub);overflow:hidden}
.srow .gl img{width:100%;height:100%;object-fit:cover}
.srow h3{margin:0;font:600 1.05rem var(--serif)}
.srow p{margin:.15rem 0 0;font-size:.85rem;color:var(--quiet)}
.srow .n{font-size:.85rem;font-weight:600;text-align:right}
.srow .n small{display:block;font-weight:500;color:var(--quiet)}
.srow.later{cursor:default}.srow.later h3,.srow.later .gl{opacity:.55}
.srow.later:hover h3{color:inherit}
.mini{height:3px;background:var(--tint);border-radius:2px;margin-top:.5rem;max-width:12rem;overflow:hidden}.mini i{display:block;height:100%;background:var(--scrub)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(15,22,38,.38);opacity:0;transition:opacity calc(.25s*var(--t))}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:41;inset:auto 0 0 0;max-height:88vh;display:flex;flex-direction:column;background:var(--sheet);border-radius:16px 16px 0 0;box-shadow:0 -6px 30px rgba(15,22,38,.18);transform:translateY(105%);transition:transform calc(.38s*var(--t)) var(--ease);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{inset:50% auto auto 50%;width:min(34rem,92vw);max-height:84vh;border-radius:12px;transform:translate(-50%,-47%);opacity:0;transition:transform calc(.3s*var(--t)) var(--ease),opacity calc(.2s*var(--t))}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--rule);margin:.55rem auto 0}
@media(min-width:760px){.grab{display:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:.6rem .9rem .6rem 1.25rem}
.sh-h h3{margin:0;font:700 1.2rem var(--serif)}
.sh-b{overflow:auto;padding:0 1.25rem 1rem;flex:1;overscroll-behavior:contain}
.sh-f{padding:.8rem 1.25rem 1rem;border-top:1px solid var(--rule);display:flex;gap:.6rem}
.search{width:100%;border:1px solid var(--rule);background:var(--page);color:var(--ink);border-radius:8px;padding:.65rem .8rem;font:500 .95rem var(--sans);margin:.2rem 0 .3rem}
.search:focus{outline:none;border-color:var(--scrub)}
.grp{display:flex;justify-content:space-between;align-items:baseline;margin:1.1rem 0 .1rem;font:600 .95rem var(--serif)}
.grp button{border:0;background:none;color:var(--scrub);font:500 .82rem var(--sans);cursor:pointer}
.pick{display:grid;grid-template-columns:1.3rem 1fr auto;gap:.75rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--rule);cursor:pointer}
.pick .bx{width:1.15rem;height:1.15rem;border-radius:4px;border:1.5px solid var(--quiet);display:grid;place-items:center;transition:background .15s,border-color .15s}
.pick.radio .bx{border-radius:50%}
.pick.on .bx{background:var(--scrub);border-color:var(--scrub)}
.pick .bx svg{width:.75rem;height:.75rem;stroke:#fff;opacity:0}
.pick.on .bx svg{opacity:1}
.pick .nm{font-size:.95rem}.pick .nm small{display:block;color:var(--quiet);font-size:.8rem}
.pick .r{font-size:.8rem;color:var(--quiet)}
.pick.dim{opacity:.45;cursor:default}
.field{margin-top:1.3rem}
.field>.lab{font:600 .92rem var(--serif);margin-bottom:.5rem}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-left:1px solid var(--rule);background:var(--sheet);padding:.55rem .3rem;font:500 .86rem var(--sans);color:var(--quiet);cursor:pointer}
.seg button:first-child{border-left:0}
.cfig{margin:.9rem 0 .2rem;text-align:center}.cfig img{max-width:100%;max-height:20rem;border-radius:10px;background:#fff;border:1px solid var(--rule);cursor:zoom-in}.cfig figcaption{font:400 .75rem var(--sans);color:var(--quiet);margin-top:.3rem}.cfig.big img{max-height:none;cursor:zoom-out}
.chain{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;margin:.9rem 0 0;padding:.8rem .9rem;border-left:3px solid var(--scrub);background:var(--sheet);border-radius:0 8px 8px 0}.chain span{font:500 .9rem/1.35 var(--sans);color:var(--ink);padding:.3rem .6rem;border:1px solid var(--rule);border-radius:6px;background:var(--page);animation:rise calc(.35s*var(--t)) var(--ease) both;animation-delay:calc(var(--i)*.12s*var(--t))}.chain span.c0{background:var(--scrub-t);border-color:var(--scrub);font-weight:600}.chain span.cz{border-color:var(--coral);font-weight:600}.chain i{font-style:normal;color:var(--scrub);margin-left:1rem;line-height:1}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.idea{margin:.9rem 0 0;padding:.75rem .9rem;border-radius:10px;background:var(--scrub-t);font:400 .9rem/1.5 var(--sans)}.idea>b{display:block;font:600 .8rem var(--sans);color:var(--scrub);margin-bottom:.2rem}.idea p{margin:0;color:var(--ink);font-weight:500}.idea .also{margin-top:.5rem}.idea .also span{font-size:.78rem;color:var(--quiet)}.idea ul{margin:.2rem 0 0;padding-left:1.1rem}.idea li{margin:.1rem 0}
.dcard{margin:.9rem 0 0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;font:400 .88rem/1.45 var(--sans)}.dcard .dh{display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;background:var(--scrub-t);padding:.55rem .8rem}.dcard .dh b{font:600 .95rem var(--serif);color:var(--ink)}.dcard .dh span{color:var(--quiet);font-size:.8rem;text-align:right}.dcard>div:not(.dh){display:grid;grid-template-columns:6.5rem 1fr;gap:.5rem;padding:.45rem .8rem;border-top:1px solid var(--rule)}.dcard dt{color:var(--quiet);font-size:.8rem}.dcard dd{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{border:1px solid var(--rule);border-radius:999px;background:var(--sheet);padding:.42rem .8rem;font:500 .86rem var(--sans);color:var(--quiet);cursor:pointer}
.chips button.on{background:var(--scrub-t);color:var(--ink);border-color:var(--scrub);font-weight:600}
.chips button small{margin-left:.35rem;color:var(--quiet);font-weight:400}
.numin{width:5.2rem;border:1px solid var(--rule);border-radius:8px;padding:.5rem .6rem;font:500 .9rem var(--sans);background:var(--sheet);color:var(--ink);margin-top:.5rem}
.seg button.on{background:var(--scrub-t);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--scrub)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--rule);cursor:pointer}
.sw small{display:block;color:var(--quiet);font-size:.8rem}
.tg{width:2.5rem;height:1.45rem;border-radius:1rem;background:var(--rule);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.45rem - 4px);height:calc(1.45rem - 4px);border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left calc(.22s*var(--t)) var(--ease)}
.tg.on{background:var(--scrub)}.tg.on::after{left:calc(2.5rem - 1.45rem + 2px)}
input[type=range]{width:100%;accent-color:var(--scrub)}
.preview{margin-top:.5rem;padding:.8rem 1rem;border-left:3px solid var(--scrub);background:var(--page);font:1.05rem/1.6 var(--read)}
.keys{font-size:.82rem;color:var(--quiet);line-height:1.9}
kbd{font:600 .74rem var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35rem;background:var(--sheet);color:var(--ink)}
@media(hover:none){.keys{display:none}}

/* Player */
.ptop{display:flex;align-items:center;gap:.7rem;padding:.9rem 0}
.ptop .bar{flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.ptop .bar i{display:block;height:100%;background:var(--ink);transition:width calc(.45s*var(--t)) var(--ease)}
.ptop .n{font:600 .85rem var(--sans);color:var(--quiet);font-variant-numeric:tabular-nums}
.streak{font:600 .85rem var(--sans);color:var(--scrub)}
.timer{font:600 .95rem var(--sans);font-variant-numeric:tabular-nums;min-width:2.6rem;text-align:center;padding:.2rem .4rem;border-radius:6px;background:var(--tint)}
.timer.low{background:var(--coral-t);color:var(--coral)}
.case{background:var(--sheet);border-radius:10px;padding:1.5rem 1.5rem 1.4rem;animation:enter calc(.35s*var(--t)) var(--ease) both}
.case.leave{animation:leave calc(.2s*var(--t)) var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes leave{to{opacity:0;transform:translateY(-6px)}}
.meta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.84rem;color:var(--quiet);margin-bottom:1rem}
.meta .topic{color:var(--scrub);font-weight:600}
.stem{font:400 1.14rem/1.7 var(--read);margin:0}
.stem.one{font:600 1.12rem/1.75 var(--read)}
.stem.one .pl{color:var(--scrub);font-weight:700;margin:0 .1em}.stem.one .ar{color:var(--coral);font-weight:700;margin:0 .1em}
.swap{border:0;background:none;color:var(--scrub);font:500 .84rem var(--sans);cursor:pointer;padding:0;margin-left:auto}.swap:hover{text-decoration:underline}
mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%);color:inherit;padding:0 .05em}
.hintline{margin-top:.9rem;padding:.6rem .85rem;border-left:3px solid var(--quiet);background:var(--page);font-size:.95rem}
.hintline b{font-weight:600;margin-right:.3rem}
.ask{font:700 1.3rem/1.35 var(--serif);margin:1.3rem 0 0;padding-top:1.1rem;border-top:1px solid var(--rule)}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-top:1rem}
.conf .q{font-size:.88rem;color:var(--quiet);margin-right:.2rem}
.conf .seg{flex:1;max-width:19rem}
.opts{margin-top:1rem;border-top:1px solid var(--rule)}
.op{display:grid;grid-template-columns:1.35rem 1.3rem 1fr;gap:.55rem;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:.8rem .4rem;cursor:pointer;font:400 1rem/1.5 var(--sans)}
.op:hover{background:var(--tint)}
.op .rd{width:1.1rem;height:1.1rem;border-radius:50%;border:1.5px solid var(--quiet);margin-top:.2rem;position:relative}
.op .lt{font-weight:600;color:var(--quiet)}
.op.right{background:var(--scrub-t);box-shadow:inset 3px 0 0 var(--scrub)}
.op.right .rd{border-color:var(--scrub);background:var(--scrub)}
.op.right .rd::after,.op.wrong .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#fff}
.op.wrong{background:var(--coral-t);box-shadow:inset 3px 0 0 var(--coral);animation:nudge calc(.35s*var(--t))}
.op.wrong .rd{border-color:var(--coral);background:var(--coral)}
.op.done{cursor:default}.op.done:hover{background:none}.op.right:hover{background:var(--scrub-t)}.op.wrong:hover{background:var(--coral-t)}
@keyframes nudge{30%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.wn{display:block;margin-top:.35rem;font-size:.92rem;line-height:1.5;color:var(--ink)}
.wn b{font-weight:600;color:var(--quiet)}
.trap{font:600 .72rem var(--sans);color:var(--coral);border:1px solid currentColor;border-radius:3px;padding:0 .3rem;margin-left:.4rem;vertical-align:.1rem}
.verdict{display:flex;align-items:center;gap:.55rem;margin-top:1.2rem;font:600 1.05rem var(--serif)}
.verdict svg{width:1.5rem;height:1.5rem;flex:none}
.verdict.ok{color:var(--scrub)}.verdict.bad{color:var(--coral)}
.verdict path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw calc(.45s*var(--t)) var(--ease) .05s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.answer{margin-top:1rem;padding:1rem 1.1rem;background:var(--page);border-radius:8px}
.answer .a{font:700 1.15rem/1.35 var(--serif)}
.answer .w{margin-top:.4rem;line-height:1.6}
.flip{margin-top:.9rem;cursor:pointer;perspective:900px}
.flip .in{position:relative;transform-style:preserve-3d;transition:transform calc(.5s*var(--t)) var(--ease)}
.flip.on .in{transform:rotateX(180deg)}
.flip .f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px dashed var(--quiet);border-radius:8px;padding:.7rem .9rem;font-size:.95rem;background:var(--sheet)}
.flip .f.bk{transform:rotateX(180deg);border-style:solid;border-color:var(--scrub)}
.flip .f small{display:block;color:var(--quiet);font-size:.78rem;margin-bottom:.15rem}
.links{display:flex;flex-wrap:wrap;gap:1.2rem;margin-top:1.1rem;font-size:.86rem;color:var(--quiet)}
.next{margin-top:1.2rem;display:flex;gap:.6rem}
.foot{font-size:.8rem;color:var(--quiet);margin-top:1rem}
.result{margin-top:1.4rem}
.result .big{font:700 2.4rem/1.1 var(--serif)}
.result .big span{color:var(--quiet);font-weight:400}

  return (LOADED[f]||(LOADED[f]=fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.json()}).then(arr=>arr.forEach(x=>{const o=TREES.find(y=>y.id===x.id);if(o)Object.assign(o,x)})).catch(e=>{delete LOADED[f];throw e})))}
const TOPIC=Object.fromEntries(CAT.topics.map(t=>[t.id,t]));
const SERIES=Object.fromEntries(CAT.series.map(s=>[s.id,s]));
/* series whose case is the clue: topic stays hidden until answered */
const HIDE_T=new Set(["spot","moa","choice","adr","bug","bugx","mech"]);
const SYSOF={};CAT.systems.forEach(y=>y.sections.forEach(sec=>sec.topics.forEach(t=>SYSOF[t]=y.id)));
const SYSNAME=Object.fromEntries(CAT.systems.map(y=>[y.id,y.name]));
const ALLSECS=CAT.systems.flatMap(y=>y.sections.map(sec=>({...sec,sys:y.id})));
const secOf=tid=>ALLSECS.find(s=>s.topics.includes(tid));
const TS=new Set(["tree","dxtree"]);
const GLYPH={dxtree:"Dx",tree:"Tree",dx:"Dx",mech:"Why",find:"Lab",phys:"Δ",where:"Loc",moa:"MOA",choice:"Rx",adr:"ADR",next:"Next",look:"Hist",gene:"Gene",embryo:"Emb",step:"Step",talk:"Talk",bug:"Bug"};

/* settings */
const CFG=load("usmle:cfg",{theme:"auto",scale:1,font:"serif",motion:"full",hl:true,opts:true,direct:true,short:false,step:"1",traps:true,hints:true,timer:60,haptics:false,exam:""});
const saveCfg=()=>store("usmle:cfg",CFG);
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyCfg(){const H=document.documentElement;H.dataset.theme=CFG.theme==="auto"?(mq.matches?"night":"day"):CFG.theme;H.dataset.font=CFG.font;H.dataset.motion=CFG.motion;H.style.setProperty("--scale",CFG.scale);
  if(CFG.motion==="reduced")H.style.setProperty("--t",".35");else H.style.removeProperty("--t");
  $('meta[name="theme-color"]').content=getComputedStyle(H).getPropertyValue("--page").trim()}
mq.addEventListener?.("change",applyCfg);applyCfg();

/* progress */
const P=load("usmle:progress",{box:{},due:{},seen:{},right:{},wrong:{},last:{},sessions:[],tn:{},retired:{}});P.tn=P.tn||{};P.retired=P.retired||{};
const saveP=()=>store("usmle:progress",P);
const isDue=id=>P.seen[id]&&(P.due[id]||0)<=now();
function topicStats(tid){const its=ITEMS.filter(i=>i.topic===tid);let r=0,w=0,s=0;its.forEach(i=>{r+=P.right[i.id]||0;w+=P.wrong[i.id]||0;s+=P.seen[i.id]?1:0});return{n:its.length,r,w,s,acc:r+w?r/(r+w):null}}
const F=load("usmle:filter",{topics:[],subjects:[],systems:[]});F.systems=(F.systems||[]).filter(x=>SYSNAME[x]);const saveF=()=>store("usmle:filter",F);
const inSys=(tid,set)=>{set=set||F.systems;return !set.length||set.includes(SYSOF[tid])};
const inFilter=i=>inSys(i.topic)&&(!F.topics.length||F.topics.includes(i.topic))&&(!F.subjects.length||F.subjects.includes(TOPIC[i.topic]?.subject));
const plural=(n,w)=>`${n} ${n===1?w:(/(s|sh|ch|x)$/.test(w)?w+"es":w+"s")}`;

/* small UI */
let toastT;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),2000)}
function buzz(ms){if(CFG.haptics&&navigator.vibrate)navigator.vibrate(ms)}
function spark(){if(CFG.motion!=="full")return;const b=document.createElement("div");b.className="spark";const c=["var(--scrub)","var(--ink)","var(--coral)","var(--marker)"];
  for(let i=0;i<18;i++){const e=document.createElement("i"),a=i/18*Math.PI*2,d=70+Math.random()*60;e.style.cssText=`background:${c[i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;b.appendChild(e)}
  document.body.appendChild(b);setTimeout(()=>b.remove(),1000)}
const bar=f=>`<div class="track"><i style="width:0" data-w="${Math.round(100*Math.max(0,Math.min(1,f)))}%"></i></div>`;
function growBars(r=document){requestAnimationFrame(()=>requestAnimationFrame(()=>$$(".track i[data-w]",r).forEach(i=>i.style.width=i.dataset.w)))}

/* sheet */
let sheetOpen=null;
function sheet({title,body,foot,onClose}){closeSheet(true);
  const scrim=document.createElement("div");scrim.className="scrim";
  const sh=document.createElement("div");sh.className="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");sh.setAttribute("aria-label",title);
  sh.innerHTML=`<div class="grab"></div><div class="sh-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Close">${ICON.close}</button></div><div class="sh-b">${body}</div>${foot?`<div class="sh-f">${foot}</div>`:""}`;
  document.body.append(scrim,sh);sheetOpen={scrim,sh,onClose};
  requestAnimationFrame(()=>{scrim.classList.add("on");sh.classList.add("on")});
  scrim.onclick=()=>closeSheet();$("[data-close]",sh).onclick=()=>closeSheet();
  let y0=null;sh.addEventListener("touchstart",e=>{if(e.target.closest(".grab,.sh-h"))y0=e.touches[0].clientY},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0==null)return;const dy=Math.max(0,e.touches[0].clientY-y0);sh.style.transition="none";sh.style.transform=`translateY(${dy}px)`},{passive:true});
  sh.addEventListener("touchend",e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;sh.style.transition="";sh.style.transform="";if(dy>100)closeSheet()});
  setTimeout(()=>($(".search",sh)||$("[data-close]",sh)).focus({preventScroll:true}),50);return sh}
function closeSheet(instant){if(!sheetOpen)return;const{scrim,sh,onClose}=sheetOpen;sheetOpen=null;
  if(instant){scrim.remove();sh.remove();return}
  scrim.classList.remove("on");sh.classList.remove("on");setTimeout(()=>{scrim.remove();sh.remove()},380);onClose&&onClose()}
const keyClick=r=>$$('[role="button"],[role="checkbox"],[role="radio"],[role="switch"]',r).forEach(b=>b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();b.click()}}));

/* navigation */
const TABS=[["today","Today"],["learn","Map"],["practice","Practice"],["test","Qbank",1],["me","Progress"]];
let view="today";
function drawTabs(){$("#tabs").innerHTML=`<div class="side"><b>Dr. Shank</b><span>USMLE ${CFG.step==="2"?"Step 2 CK":"Step 1"}</span></div>`+TABS.map(([k,n,soon])=>`<button class="tab${view===k?" on":""}" data-v="${k}" ${soon?'disabled title="Coming soon"':""} aria-current="${view===k?"page":"false"}">${ICON[k]}<span>${n}</span></button>`).join("");
  $$(".tab:not([disabled])").forEach(b=>b.onclick=()=>go(b.dataset.v));$$(".tab[disabled]").forEach(b=>b.onclick=()=>toast(b.dataset.v==="learn"?"Boards and videos come after the series.":"The question bank comes after the full cardio series."))}
function go(v){view=v;drawTabs();document.body.classList.toggle("focus",v==="player"||v==="tree");const M=$("#main");
  const paint=()=>{M.innerHTML="";const d=document.createElement("div");d.className="view";M.appendChild(d);({today:Today,practice:Practice,me:Me,player:Player,tree:TreePlayer,learn:Learn})[v](d);scrollTo({top:0,behavior:"instant"});growBars(M);keyClick(M)};
  if(document.startViewTransition&&CFG.motion==="full"&&v!=="player"&&v!=="tree")document.startViewTransition(paint);else paint()}
const MAST=()=>`<header class="mast"><span class="word">Dr. Shank<span>${CFG.step==="2"?"Step 2 CK":"Step 1"}</span></span><button class="iconbtn" data-gear aria-label="Settings">${ICON.gear}</button></header>`;
const wireGear=r=>$$("[data-gear]",r).forEach(b=>b.onclick=openSettings);

/* Today */
function Today(V){
  const LIVE=ITEMS.filter(i=>!P.retired[i.id]),due=LIVE.filter(i=>isDue(i.id)),fresh=LIVE.filter(i=>!P.seen[i.id]),seen=ITEMS.filter(i=>P.seen[i.id]).length;
  const days=CFG.exam?Math.ceil((new Date(CFG.exam+"T00:00")-now())/DAY):null,last=P.sessions[P.sessions.length-1];
  const weak=CAT.topics.map(t=>({t,s:topicStats(t.id)})).filter(x=>x.s.acc!=null&&x.s.acc<1).sort((a,b)=>a.s.acc-b.s.acc).slice(0,3);
  const nNew=Math.min(fresh.length,10),todo=due.length+nNew,mins=Math.max(2,Math.round(todo*.6));
  const headline=todo?(due.length&&nNew?`${plural(due.length,"review")} and ${plural(nNew,"new card")}`:due.length?`${plural(due.length,"card")} to review`:`${plural(nNew,"new card")}`):"You're up to date";
  V.innerHTML=`${MAST()}
   <div class="date">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</div>
   <h1>Today</h1><div class="rulebar"></div>
   <section class="plan" aria-label="Today's plan">
     <p class="big">${headline}.</p>
     <p class="sm">${todo?`About ${mins} minutes. Reviews come first.`:"Nothing is due. A shuffled set keeps things fresh."}</p>
     <button class="btn go" id="plan">${todo?"Start today's cards":"Practise 10 random cards"}</button>
     ${bar(ITEMS.length?seen/ITEMS.length:0)}<div class="trackcap"><span>${seen} of ${ITEMS.length} cards practised</span><span>${ITEMS.filter(i=>(P.box[i.id]||0)>=3).length} solid</span></div>
   </section>
   <div class="exam">${days!=null&&days>=0?`<b>${days}</b> days to your exam <button class="btn text" id="exam">Change</button>`:`No exam date yet. <button class="btn text" id="exam">Set your exam date</button>`}</div>
   ${last?`<h2>Last session</h2><div class="list"><div class="li"><div><div class="t">${esc(last.name)}</div><div class="s">${last.got} of ${last.n} right on ${new Date(last.at).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</div></div><button class="btn" id="cont">${last.miss.length?`Redo ${plural(last.miss.length,"miss")}`:"Do it again"}</button></div></div>`:""}
   <h2>Weak spots</h2>
   <div class="list">${weak.length?weak.map(x=>`<div class="li tap" data-fix="${x.t.id}" role="button" tabindex="0"><div><div class="t">${esc(x.t.title)}</div><div class="s">${x.s.r} right, ${x.s.w} wrong</div></div><span class="acc">${Math.round(100*x.s.acc)}%</span></div>`).join(""):`<div class="empty">Your three weakest topics will show here once you've answered a few cards.</div>`}</div>
   <h2>Quick practice</h2>
   <div class="list">
     ${ITEMS.some(i=>i.series==="mech")?`<div class="li tap" data-quick="mech" role="button" tabindex="0"><div><div class="t">Why does it happen?</div><div class="s">${ITEMS.filter(i=>i.series==="mech").length} cards: the mechanism behind the case. Pick systems and how many.</div></div></div>`:""}
     ${ITEMS.some(i=>["bug","bugx"].includes(i.series))?`<div class="li tap" data-quick="micro" role="button" tabindex="0"><div><div class="t">Micro</div><div class="s">${ITEMS.filter(i=>["bug","bugx"].includes(i.series)).length} cards: which bug, and how it does it. Pick systems and how many.</div></div></div>`:""}
     ${ITEMS.some(i=>["moa","choice","adr"].includes(i.series))?`<div class="li tap" data-quick="drugs" role="button" tabindex="0"><div><div class="t">Drugs</div><div class="s">${ITEMS.filter(i=>["moa","choice","adr"].includes(i.series)).length} cards: how it works, which drug, side effect. Pick systems and how many.</div></div></div>`:""}
     ${ITEMS.some(i=>i.series==="spot")?`<div class="li tap" data-quick="spot" role="button" tabindex="0"><div><div class="t">Spot the diagnosis</div><div class="s">${ITEMS.filter(i=>i.series==="spot").length} short cases across ${plural(new Set(ITEMS.filter(i=>i.series==="spot").map(i=>SYSOF[i.topic])).size,"system")}, shuffled. Pick systems and how many.</div></div></div>`:""}
     ${DXT().length?`<div class="li tap" data-quick="dx" role="button" tabindex="0"><div><div class="t">Diagnosis cases</div><div class="s">${(n=>n?`${plural(n,"case")} to do, picked at random`:"Up to date")(DXT().filter(x=>treeDueCount(x)).length)}</div></div></div>`:""}
     ${TREES.filter(x=>x.series!=="dxtree").map(x=>`<div class="li tap" data-tree="${x.id}" role="button" tabindex="0"><div style="display:flex;gap:.9rem;align-items:center"><img src="${x.plate}" alt="" style="width:3rem;height:3rem;border-radius:50%;object-fit:cover;background:#fff"><div><div class="t">${x.kind==="hub"?"Big tree":x.series==="dxtree"?"Diagnosis tree":"Concept tree"}: ${esc(x.title)}</div><div class="s">${treeDueCount(x)?`${plural(treeDueCount(x),"branch")} to do`:"Up to date"}</div></div></div></div>`).join("")}
     <div class="li tap" data-quick="random" role="button" tabindex="0"><div><div class="t">Random 10</div><div class="s">Any topic and question type, shuffled like the exam</div></div></div>
     <div class="li tap" data-quick="rapid" role="button" tabindex="0"><div><div class="t">Timed sprint</div><div class="s">${CFG.timer} seconds a card, no hints</div></div></div>
   </div>`;
  wireGear(V);
  $("#plan").onclick=()=>todo?startRun({name:"Today's cards",mode:"learn",pool:[...due,...fresh.slice(0,nNew)],keepOrder:true}):startRun({name:"Random 10",mode:"random",pool:ITEMS,size:10});
  $("#exam").onclick=openExamDate;
  if(last)$("#cont").onclick=()=>{const ids=last.miss.length?last.miss:last.ids;startRun({name:last.name,mode:"learn",pool:ITEMS.filter(i=>ids.includes(i.id)),keepOrder:true})};
  $$("[data-fix]",V).forEach(b=>b.onclick=()=>startRun({name:TOPIC[b.dataset.fix].title,mode:"learn",pool:ITEMS.filter(i=>i.topic===b.dataset.fix)}));
  $$("[data-tree]",V).forEach(b=>b.onclick=()=>openTree(b.dataset.tree));
  $$("[data-quick]",V).forEach(b=>b.onclick=()=>b.dataset.quick==="dx"?randomCase():b.dataset.quick==="mech"?openStart({id:"mechx",ids:["mech"],name:"Why does it happen?",blurb:"The mechanism behind the case"}):b.dataset.quick==="micro"?openStart({id:"micro",ids:["bug","bugx"],name:"Micro",blurb:"Which bug and how it does it, mixed"}):b.dataset.quick==="drugs"?openStart({id:"drugs",ids:["moa","choice","adr"],name:"Drugs",blurb:"How it works, which drug and side effects, mixed"}):b.dataset.quick==="spot"?openStart(SERIES.spot):b.dataset.quick==="random"?startRun({name:"Random 10",mode:"random",pool:ITEMS,size:10}):startRun({name:"Timed sprint",mode:"rapid",pool:ITEMS,size:10}))}
function openExamDate(){const sh=sheet({title:"Exam date",body:`<div class="field"><div class="lab">When is your Step 1?</div><input id="ed" type="date" class="search" value="${CFG.exam||""}"></div><p class="lede">The countdown and the daily plan use this date.</p>`,foot:`<button class="btn go wide" id="eds">Save date</button>`});
  $("#eds",sh).onclick=()=>{CFG.exam=$("#ed",sh).value;saveCfg();closeSheet();go("today");toast("Exam date saved")}}

/* Practice */
function Practice(V){
  const nT=F.topics.length,nS=F.subjects.length,pool=ITEMS.filter(inFilter);
  const nY=F.systems.length,nb=sid=>CAT.topics.filter(t=>inSys(t.id)&&(!nT||F.topics.includes(t.id))&&(!nS||F.subjects.includes(t.subject))).reduce((a,t)=>a+((t.series_counts||{})[sid]||0),0);
  const tpoolAll=TREES.filter(x=>inSys(x.topic)&&(!nT||F.topics.includes(x.topic))&&(!nS||F.subjects.includes(TOPIC[x.topic]?.subject))),tp=sid=>tpoolAll.filter(x=>x.series===sid);
  const rows=CAT.series.map(s=>({s,n:TS.has(s.id)?tp(s.id).length:pool.filter(i=>i.series===s.id).length,nb:TS.has(s.id)?tp(s.id).length:nb(s.id)})).filter(x=>(x.n||x.nb||TS.has(x.s.id))&&!(x.s.id==="dx"&&TREES.some(y=>y.series==="dxtree"))).sort((a,b)=>TS.has(b.s.id)-TS.has(a.s.id)||(b.n>0)-(a.n>0)||b.nb-a.nb);
  V.innerHTML=`${MAST()}
   <h1>Practice</h1><div class="rulebar"></div>
   <p class="lede">Short drills on what Step 1 tests most, one kind of question at a time.</p>
   <div class="filters">
     <button class="drop${nY?" set":""}" id="fSys">${nY?`<b>${nY===1?esc(SYSNAME[F.systems[0]]):nY+" systems"}</b>`:"All systems"} ${ICON.down}</button>
     <button class="drop${nT?" set":""}" id="fTop">${nT?(nT===1?`<b>${esc(TOPIC[F.topics[0]].title)}</b>`:`<b>${nT} topics</b>`):"All topics"} ${ICON.down}</button>
     <button class="drop${nS?" set":""}" id="fSub">${nS?`<b>${nS===1?esc(F.subjects[0]):nS+" subjects"}</b>`:"All subjects"} ${ICON.down}</button>
     ${nT||nS||nY?`<button class="btn text" id="fClr">Clear filters</button>`:""}
   </div>
   <div class="series">${rows.map(({s,n,nb})=>{const sn=TS.has(s.id)?tp(s.id).filter(x=>P.seen[x.id]).length:pool.filter(i=>i.series===s.id&&P.seen[i.id]).length,due=pool.filter(i=>i.series===s.id&&isDue(i.id)).length;
     return `<div class="srow${n?"":" later"}" data-s="${s.id}" role="button" tabindex="0">
       <div class="gl">${TS.has(s.id)&&s.id!=="dxtree"&&tp(s.id)[0]?`<img src="${tp(s.id)[0].plate}" alt="">`:COVERS[s.id]?`<img src="${COVERS[s.id]}" alt="">`:GLYPH[s.id]||""}</div>
       <div><h3>${esc(s.name)}</h3><p>${esc(s.blurb)}.${TS.has(s.id)||!nb?"":` ${plural(nb,"high-yield fact")} to cover.`}</p>${n?`<div class="mini"><i style="width:${Math.round(100*sn/n)}%"></i></div>`:""}</div>
       <div class="n">${n?`${plural(n,TS.has(s.id)?"tree":"card")}${due?`<small>${due} due</small>`:""}`:`<small>In progress</small>`}</div></div>`}).join("")||`<div class="empty" style="padding:1rem 1.1rem">Nothing matches these filters. Clear them to see every series.</div>`}</div>`;
  wireGear(V);
  $("#fSys").onclick=openSystems;
  $("#fTop").onclick=openTopics;$("#fSub").onclick=openSubjects;
  if($("#fClr"))$("#fClr").onclick=()=>{F.topics=[];F.subjects=[];F.systems=[];saveF();go("practice")};
  $$(".srow",V).forEach(r=>r.onclick=()=>{if(TS.has(r.dataset.s))return tp(r.dataset.s).length?openTrees(tp(r.dataset.s),SERIES[r.dataset.s].name):toast("Trees for these topics are being written.");const s=SERIES[r.dataset.s];pool.some(i=>i.series===s.id)?openStart(s):toast(`${s.name} cards are being written.`)})}
function openTopics(){const sel=new Set(F.topics);
  const draw=q=>{q=(q||"").toLowerCase();return ALLSECS.filter(sec=>inSys(sec.topics[0])).map(sec=>{const ts=sec.topics.map(id=>TOPIC[id]).filter(t=>!q||(t.title+" "+t.subject).toLowerCase().includes(q));if(!ts.length)return"";
    return `<div class="grp">${CAT.systems.length>1&&F.systems.length!==1?esc(SYSNAME[sec.sys])+": ":""}${esc(sec.name)}<button data-all="${esc(sec.name)}">${ts.every(t=>sel.has(t.id))?"Clear":"Select all"}</button></div>`+ts.map(t=>{const st=topicStats(t.id);
      return `<div class="pick${sel.has(t.id)?" on":""}" data-t="${t.id}" role="checkbox" aria-checked="${sel.has(t.id)}" tabindex="0"><span class="bx">${ICON.tick}</span><span class="nm">${esc(t.title)}<small>${esc(t.subject)}, ${"tested "+t.nbme_questions+"×"}</small></span><span class="r">${st.n?`${st.s}/${st.n} done`:""}</span></div>`}).join("")}).join("")||`<div class="empty">No topic matches “${esc(q)}”.</div>`};
  const sh=sheet({title:"Topics",body:`<input class="search" placeholder="Search, e.g. mitral, shock, beta-blocker" aria-label="Search topics"><div id="tl"></div>`,foot:`<button class="btn" id="tc">Clear</button><button class="btn go wide" id="td"></button>`});
  const count=()=>$("#td",sh).textContent=sel.size?`Show ${plural(sel.size,"topic")}`:"Show all topics";
  const paint=()=>{$("#tl",sh).innerHTML=draw($(".search",sh).value);keyClick(sh);
    $$(".pick",sh).forEach(o=>o.onclick=()=>{const id=o.dataset.t;sel.has(id)?sel.delete(id):sel.add(id);o.classList.toggle("on");o.setAttribute("aria-checked",sel.has(id));count()});
    $$("[data-all]",sh).forEach(b=>b.onclick=()=>{const sec=ALLSECS.find(s=>s.name===b.dataset.all),all=sec.topics.every(t=>sel.has(t));sec.topics.forEach(t=>all?sel.delete(t):sel.add(t));paint();count()})};
  $(".search",sh).oninput=paint;paint();count();
  $("#tc",sh).onclick=()=>{sel.clear();paint();count()};
  $("#td",sh).onclick=()=>{F.topics=[...sel];saveF();closeSheet();go("practice")}}
function openSystems(){const sel=new Set(F.systems);
  const n=y=>ITEMS.filter(i=>SYSOF[i.topic]===y.id&&!P.retired[i.id]).length+TREES.filter(x=>SYSOF[x.topic]===y.id).length;
  const sh=sheet({title:"Systems",body:`<p class="lede" style="margin-top:0">Pick one system, or several to mix them.</p>`+CAT.systems.filter(y=>n(y)).map(y=>`<div class="pick${sel.has(y.id)?" on":""}" data-y="${y.id}" role="checkbox" aria-checked="${sel.has(y.id)}" tabindex="0"><span class="bx">${ICON.tick}</span><span class="nm">${esc(y.name)}<small>${plural(n(y),"card")}</small></span><span></span></div>`).join(""),foot:`<button class="btn" id="yc">All systems</button><button class="btn go wide" id="yd">Show series</button>`});
  keyClick(sh);$$(".pick",sh).forEach(o=>o.onclick=()=>{const y=o.dataset.y;sel.has(y)?sel.delete(y):sel.add(y);o.classList.toggle("on");o.setAttribute("aria-checked",sel.has(y))});
  const done=()=>{F.systems=[...sel];F.topics=F.topics.filter(t=>inSys(t));saveF();closeSheet();go("practice")};
  $("#yc",sh).onclick=()=>{sel.clear();done()};$("#yd",sh).onclick=done}
function openSubjects(){const sel=new Set(F.subjects);
  const sh=sheet({title:"Subjects",body:CAT.subjects.map(s=>{const n=CAT.topics.filter(t=>t.subject===s).reduce((a,t)=>a+t.nbme_questions,0);return `<div class="pick${sel.has(s)?" on":""}" data-s="${esc(s)}" role="checkbox" aria-checked="${sel.has(s)}" tabindex="0"><span class="bx">${ICON.tick}</span><span class="nm">${esc(s)}<small>${"tested "+n+"×"}</small></span><span></span></div>`}).join(""),foot:`<button class="btn go wide" id="sd">Show series</button>`});

  wire();$("#go",sh).onclick=()=>{const p=pool();if(!p.length)return toast("No cards in those systems yet.");F.systems=[...ys];saveF();closeSheet();startRun({name:s.name,mode,pool:p,size})}}

/* run */
let RUN=null;
function startRun({name,mode,pool,size=10,keepOrder}){let q;pool=pool.filter(i=>!P.retired[i.id]);
  if(mode==="due")q=pool.filter(i=>isDue(i.id)).sort((a,b)=>(P.box[a.id]||0)-(P.box[b.id]||0));
  else if(mode==="missed")q=pool.filter(i=>(P.wrong[i.id]||0)&&(P.box[i.id]||0)===0);
  else if(mode==="random"||mode==="rapid")q=shuffle(pool);
  else if(keepOrder)q=pool.slice();
  else{const due=pool.filter(i=>isDue(i.id)),fresh=pool.filter(i=>!P.seen[i.id]).sort((a,b)=>(b.times_tested||1)-(a.times_tested||1)),rest=pool.filter(i=>P.seen[i.id]&&!isDue(i.id));q=[...due,...fresh,...rest]}
  q=q.slice(0,size);if(!q.length)return toast("Nothing to practise there right now.");
  const begin=()=>{RUN={name,mode,q,pos:0,got:0,answered:0,miss:[],streak:0,t0:now(),again:new Set()};go("player")};
  if(q.every(i=>i.stem))return begin();
  const slow=setTimeout(()=>toast("Loading cards…"),350);
  need(q).then(()=>{clearTimeout(slow);begin()}).catch(()=>{clearTimeout(slow);toast("Couldn't load these cards. Check your connection and try again.")})}

/* player */

const OPT=it=>!CFG.traps&&it.nbmeOptions?{o:it.nbmeOptions,c:it.nbmeCorrect,nb:true}:{o:it.options,c:it.correct,nb:false};
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function HL(t,it){if(!CFG.hl||!it.highlight)return t;let o=t;[...it.highlight].sort((a,b)=>b.length-a.length).forEach(p=>{o=o.replace(new RegExp("("+rx(p)+"[A-Za-z]*)(?![^<]*>)","g"),"<mark>$1</mark>")});return o}
let ph,conf,picked,hintOn,tick,tStart;
function Player(V){

    if(left<=0){clearInterval(tick);if(ph!=="done"){picked="_time";conf="guess";ph="done";record();stage(true)}}},250)}}
function confSeg(){return `<div class="conf"><span class="q">How sure are you?</span><div class="seg" id="cf">${[["sure","Sure"],["unsure","Unsure"],["guess","Guess"]].map(([v,n])=>`<button data-cf="${v}" class="${conf===v?"on":""}">${n}</button>`).join("")}</div></div>`}
function stage(timedOut){const it=RUN.q[RUN.pos],S=$("#stage");if(!S)return;
  const hs=CFG.hints&&RUN.mode!=="rapid"?(it.hints||[]):[],hintBtn=hs.length&&!hintOn?`<button class="btn text" id="hb">Show a hint</button>`:"";
  if(ph==="rate"){
    S.innerHTML=`${confSeg()}<p class="lede" style="font-size:.88rem">Answer in your head, then say how sure you are.</p>${hintBtn}`;
    $$("[data-cf]",S).forEach(b=>b.onclick=()=>{conf=b.dataset.cf;ph=CFG.opts?"options":"reveal";stage()})}
  else if(ph==="reveal"){
    S.innerHTML=`${answerBlock(it)}<div class="next"><button class="btn" id="m">I missed it</button><button class="btn go" id="g">I had it</button></div>`;
    wireFlip(S);$("#m").onclick=()=>selfGrade(false);$("#g").onclick=()=>selfGrade(true)}

    S.innerHTML=`${quick?confSeg():""}<div class="opts" role="radiogroup">${Object.entries(OPT(it).o).map(([l,tx])=>`<button class="op" data-l="${l}" role="radio" aria-checked="false"><span class="rd"></span><span class="lt">${l}</span><span>${tx}</span></button>`).join("")}</div>${hintBtn?`<div style="margin-top:.6rem">${hintBtn}</div>`:""}`;
    $$(".op",S).forEach(b=>b.onclick=()=>pick(b.dataset.l));
    $$("[data-cf]",S).forEach(b=>b.onclick=()=>{conf=b.dataset.cf;$$("[data-cf]",S).forEach(x=>x.classList.toggle("on",x===b))})}
  else{const O=OPT(it),ok=picked===O.c,good=ok&&conf!=="guess";
    const msg=timedOut?"Time ran out. This card comes back soon.":ok?(conf==="guess"?"Correct, but you guessed, so it comes back soon.":conf==="unsure"?"Correct. You were unsure, so it comes back tomorrow.":"Correct."):"Not quite. This card comes back soon.";
    S.innerHTML=`<div class="opts">${Object.entries(O.o).map(([l,tx])=>{const c=l===O.c?"right":l===picked?"wrong":"",wn=O.nb?null:(it.whyNot||{})[l],tr=!O.nb&&(it.traps||[]).includes(l);
        return `<div class="op done ${c}"><span class="rd"></span><span class="lt">${l}</span><span>${tx}${tr?'<span class="trap">Trap</span>':""}${l!==O.c&&wn?`<span class="wn"><b>Why not:</b> ${BOLD(wn)}</span>`:""}</span></div>`}).join("")}</div>
      <div class="verdict ${good?"ok":"bad"}"><svg viewBox="0 0 24 24">${good?'<path d="m5 12.5 4.5 4.5L19 7.5"/>':'<path d="M7 7l10 10M17 7 7 17"/>'}</svg><span>${msg}</span></div>
      ${answerBlock(it)}
      <div class="links">${HIDE_T.has(it.series)?`<span>Topic: ${esc(TOPIC[it.topic]?.title||"")}</span>`:""}<span>Board: coming soon</span><span>Video: coming soon</span></div>
      <div class="next"><button class="btn go" id="nx">${RUN.pos+1<RUN.q.length?"Next card":"See results"}</button><button class="btn text" id="nev">Never show this card again</button></div>`;
    wireFlip(S);$("#nx").onclick=next;$("#nev").onclick=()=>{P.retired[it.id]=1;saveP();toast("Hidden. You can bring it back in Progress.");next()};$("#nx").focus({preventScroll:true})}
  if($("#hb"))$("#hb").onclick=showHint}
function chainHTML(c){return `<div class="chain" aria-label="Mechanism, step by step">${c.map((x,i)=>`${i?'<i aria-hidden="true">↓</i>':""}<span style="--i:${i}"${i===0?' class="c0"':i===c.length-1?' class="cz"':""}>${esc(x)}</span>`).join("")}</div>`}
function ideaHTML(d){return `<div class="idea"><b>Key idea</b><p>${BOLD(esc(d.rule||""))}</p>${(d.also||[]).length?`<div class="also"><span>Same idea elsewhere</span><ul>${d.also.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`:""}</div>`}
function bugCard(b){const r=(k,v)=>v?`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`:"";return `<dl class="dcard bcard"><div class="dh"><b><i>${esc(b.name)}</i></b><span>${esc(b.type||"")}</span></div>${r("Lab clue",b.lab)}${r("Virulence",b.virulence)}${r("Spread",b.spread)}${r("Causes",b.causes)}</dl>`}

function answerBlock(it){return `<div class="answer"><div class="a">${it.answer}</div><div class="w">${BOLD(it.why)}</div>${it.chain?chainHTML(it.chain):""}${it.idea?ideaHTML(it.idea):""}${it.drug?drugCard(it.drug):""}${it.bug?bugCard(it.bug):""}
  ${it.reverse?`<div class="flip" id="flip" role="button" tabindex="0" aria-label="Flip the card"><div class="in"><div class="f"><small>Flip it: tap to check</small>${it.reverse.ask}</div><div class="f bk"><small>Answer</small><b>${it.reverse.answer}</b></div></div></div>`:""}</div>`}

function selfGrade(ok){picked=ok?OPT(RUN.q[RUN.pos]).c:"_";record();next()}
function pick(l){if(ph!=="options")return;clearInterval(tick);if(RUN.mode==="rapid")conf=(now()-tStart)/1000<CFG.timer/2?"sure":"unsure";picked=l;ph="done";record();stage()}
function record(){const it=RUN.q[RUN.pos],ok=picked===OPT(it).c,id=it.id;P.seen[id]=1;P.last[id]=now();RUN.answered++;let box=P.box[id]||0;
  if(ok&&conf!=="guess"){box=conf==="sure"?Math.min(box+1,GAP.length-1):Math.max(box,1);RUN.got++;P.right[id]=(P.right[id]||0)+1;RUN.streak++}
  else{box=0;P.wrong[id]=(P.wrong[id]||0)+1;RUN.miss.push(id);RUN.streak=0;
    if(RUN.mode!=="rapid"&&!RUN.again.has(id)&&!RUN.q.slice(RUN.pos+1).includes(it)){RUN.again.add(id);RUN.q.splice(Math.min(RUN.pos+4,RUN.q.length),0,it)}}
  P.box[id]=box;P.due[id]=box?now()+GAP[box]*DAY:now()+10*MIN;saveP();
  if(ok&&conf!=="guess"){buzz(12);if(RUN.streak&&RUN.streak%5===0)spark()}else buzz([25,40,25])}
function next(){const c=$("#qc"),adv=()=>{RUN.pos++;RUN.pos<RUN.q.length?go("player"):end()};if(c&&CFG.motion==="full"){c.classList.add("leave");setTimeout(adv,180)}else adv()}

  const missU=[...new Set(r.miss)],mins=Math.max(1,Math.round((now()-r.t0)/6e4));
  if(r.answered){P.sessions.push({name:r.name,mode:r.mode,at:now(),n:r.answered,got:r.got,miss:missU,ids:[...new Set(r.q.slice(0,r.pos+1).map(i=>i.id))]});P.sessions=P.sessions.slice(-30);saveP()}
  view="practice";drawTabs();document.body.classList.remove("focus");const M=$("#main");M.innerHTML="";const V=document.createElement("div");V.className="view";M.appendChild(V);
  V.innerHTML=`${MAST()}<h1>${esc(r.name)}</h1><div class="rulebar"></div>
   <div class="result"><div class="big">${r.got}<span> of ${r.answered} right</span></div>
   <p class="lede">${mins} min. ${missU.length?`${plural(missU.length,"card")} to look at again.`:"Nothing to redo."} Wrong and guessed cards come back soon, unsure ones tomorrow, and sure ones after 1, 3, 7, 14 and 30 days.</p></div>
   ${missU.length?`<h2>Look at these again</h2><div class="miss">${missU.map(id=>{const i=ITEMS.find(x=>x.id===id);return `<div><b>${i.answer}</b><span>${BOLD(i.why)}</span></div>`}).join("")}</div>`:""}
   <div class="next" style="margin-top:1.4rem">${missU.length?`<button class="btn go" id="redo">Redo the misses</button>`:""}<button class="btn" id="home">Back to Today</button><button class="btn text" id="more">More practice</button></div>`;
  wireGear(V);if(r.answered>=5&&r.got/r.answered>=.8)spark();

  const env=pts=>`<polygon class="mur" points="${pts}"/>`;let m="";

  else if(k==="mvp")m=bar(104,30,"click","snd thin")+env(`110,${base} 158,${base-28} 162,${base}`);

   </div>
   <div class="legend"><span><i class="lg has"></i>Has cards or a tree</span><span><i class="lg ring"></i>Concept tree</span><span><i class="lg x"></i>Linked idea</span><span><i class="lg"></i>Coming</span></div>
   <p class="lede" style="font-size:.88rem">${nHave} of ${nTopics} topics have content so far. Each topic will get its own concept tree; together they make this map. Pharmacology and other subjects will get their own maps, linked to this one where ideas cross.</p>
   <h2>Browse as a list</h2>
   <div class="list">${secs.map((s,si)=>`<details class="secd" data-si="${si}"><summary><span class="t">${esc(s.name)}</span><span class="s">${plural(s.topics.length,"topic")}</span></summary>${s.topics.map(tid=>{const c=topicContent(tid);return `<div class="li tap" data-t="${tid}" role="button" tabindex="0"><div><div class="t" style="font-weight:500">${esc(TOPIC[tid].title)}</div><div class="s">${c.have?[c.trees.length?plural(c.trees.length,"tree"):"",c.cards.length?plural(c.cards.length,"card"):""].filter(Boolean).join(", "):"Coming soon"}</div></div></div>`}).join("")}</details>`).join("")}</div>`;
  wireGear(V);
  // pan and zoom
  const G=$("#mapg"),SV=$("#map");let z={k:1,x:0,y:0},anim=false;
  const apply=a=>{G.style.transition=a&&CFG.motion!=="off"?"transform .55s cubic-bezier(.2,.8,.2,1)":"none";G.style.transform=`translate(${z.x}px,${z.y}px) scale(${z.k})`;SV.classList.toggle("zoomed",z.k>1.05)};
  const unit=()=>1000/SV.getBoundingClientRect().width;
  const focusPt=(px,py,k)=>{z={k,x:-px*k,y:-py*k};apply(true)};
  const dim=si=>{$$(".lk,.leaf,.ll,.sl,.sec",SV).forEach(e=>e.classList.toggle("fade",si!=null&&!e.classList.contains("s"+si)))};
  const zoomBy=(m,cx=0,cy=0)=>{const k=Math.min(4,Math.max(1,z.k*m));z.x=cx-(cx-z.x)*k/z.k;z.y=cy-(cy-z.y)*k/z.k;z.k=k;if(k===1){z.x=0;z.y=0}apply(true)};
  $("#zin").onclick=()=>zoomBy(1.5);$("#zout").onclick=()=>zoomBy(1/1.5);
  const reset=()=>{z={k:1,x:0,y:0};apply(true);dim(null)};$("#zreset").onclick=reset;$("#mroot").onclick=reset;
  SV.addEventListener("wheel",e=>{e.preventDefault();const r=SV.getBoundingClientRect(),u=unit();zoomBy(e.deltaY<0?1.15:1/1.15,(e.clientX-r.left)*u-500,(e.clientY-r.top)*u-500)},{passive:false});
  const ptrs=new Map();let last=null,moved=0,pinch=null;
  SV.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===1){last=[e.clientX,e.clientY];moved=0}else{const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:z.k}}});
  SV.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);z.k=Math.min(4,Math.max(1,pinch.k*d/pinch.d));apply(false);return}
    if(last&&z.k>1){const u=unit();z.x+=(e.clientX-last[0])*u;z.y+=(e.clientY-last[1])*u;moved+=Math.abs(e.clientX-last[0])+Math.abs(e.clientY-last[1]);last=[e.clientX,e.clientY];apply(false);if(moved>6)SV.setPointerCapture(e.pointerId)}});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)last=null};SV.addEventListener("pointerup",up);SV.addEventListener("pointercancel",up);
  const tapOK=()=>moved<=6;
  const goSec=si=>{const a=S[si].a,[px,py]=pt((R1+R2)/2+40,a);focusPt(px,py,2.1);dim(si)};
  $$("[data-s]",SV).forEach(g=>g.addEventListener("click",()=>{if(tapOK())goSec(+g.dataset.s)}));
  $$("[data-t]",V).forEach(g=>g.addEventListener("click",()=>{if(tapOK())openTopic(g.dataset.t)}));
  keyClick(V);
  if(MAPFOCUS&&L[MAPFOCUS]){const si=L[MAPFOCUS].si;setTimeout(()=>{goSec(si);$$(`.leaf[data-t="${MAPFOCUS}"]`,SV).forEach(x=>x.classList.add("pulse"));MAPFOCUS=null},CFG.motion==="off"?0:900)}}
function openTopic(tid){const t=TOPIC[tid],c=topicContent(tid),sec=secOf(tid)||{name:SYSNAME[SYSOF[tid]]||""};
  const also=[...new Set(c.trees.flatMap(x=>x.nodes.map(n=>n.also).filter(Boolean)))];
  const sh=sheet({title:t.title,body:`<p class="lede" style="margin-top:0">${esc(sec.name)}, ${esc(t.subject)}</p>
    <div class="list" style="padding:0;background:none">
     ${c.trees.map(x=>`<div class="li tap" data-open-tree="${x.id}" role="button" tabindex="0"><div><div class="t">Concept tree: ${esc(x.title)}</div><div class="s">${plural(x.nodes.length,"branch")}, ${treeDueCount(x)?`${treeDueCount(x)} to do`:"up to date"}</div></div></div>`).join("")}
     ${c.cards.length?`<div class="li tap" id="tpc" role="button" tabindex="0"><div><div class="t">Practise ${plural(c.cards.length,"card")}</div><div class="s">${c.cards.filter(i=>P.seen[i.id]).length} done so far</div></div></div>`:""}
     ${c.linked.map(x=>`<div class="li tap" data-open-tree="${x.id}" role="button" tabindex="0"><div><div class="t">Also a branch in: ${esc(x.title)}</div><div class="s">${esc(x.nodes.find(n=>n.link===tid).a)}</div></div></div>`).join("")}
     ${also.map(a=>`<div class="li"><div><div class="t" style="font-weight:500">Also connects to ${esc(a)}</div><div class="s">That map comes later</div></div></div>`).join("")}
     <div class="li"><div><div class="t" style="font-weight:500;color:var(--quiet)">Board and video</div><div class="s">Coming soon</div></div></div>
     ${!c.have?`<div class="empty">Cards and a concept tree for this topic are being written.</div>`:""}</div>`});
  keyClick(sh);$$("[data-open-tree]",sh).forEach(b=>b.onclick=()=>{closeSheet(true);openTree(b.dataset.openTree)});
  if($("#tpc",sh))$("#tpc",sh).onclick=()=>{closeSheet(true);startRun({name:t.title,mode:"learn",pool:c.cards})}}

/* Progress */
function Me(V){
  const secs=ALLSECS.map(s=>{let r=0,w=0,n=0,seen=0;s.topics.forEach(t=>{const x=topicStats(t);r+=x.r;w+=x.w;n+=x.n;seen+=x.s});return{s,r,w,n,seen}}).filter(x=>x.n);
  const R=Object.values(P.right).reduce((a,b)=>a+b,0),W=Object.values(P.wrong).reduce((a,b)=>a+b,0);
  V.innerHTML=`${MAST()}<h1>Progress</h1><div class="rulebar"></div>
   <p class="lede">${R+W?`${Math.round(100*R/(R+W))}% of your answers are right across ${plural(P.sessions.length,"session")}.`:"Answer some cards and your progress shows here."}</p>
   <h2>By section</h2>
   <div class="list">${secs.map(x=>`<div class="li"><div style="flex:1"><div class="t">${esc(x.s.name)}</div><div class="s">${x.seen} of ${x.n} cards practised</div>${bar(x.n?x.seen/x.n:0)}</div><span class="acc" style="color:var(--ink)">${x.r+x.w?Math.round(100*x.r/(x.r+x.w))+"%":""}</span></div>`).join("")||`<div class="empty">No cards yet.</div>`}</div>
   <h2>Settings</h2>
   <div class="list"><div class="li tap" id="st" role="button" tabindex="0"><div><div class="t">Display and study</div><div class="s">Theme, text size, font, animations, options, hints</div></div></div>
   <div class="li tap" id="exd" role="button" tabindex="0"><div><div class="t">Exam date</div><div class="s">${CFG.exam?new Date(CFG.exam+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"Not set"}</div></div></div>
   ${(()=>{const n=Object.keys(P.retired).length+Object.values(P.tn).filter(s=>s.retired).length;return n?`<div class="li tap" id="unhide" role="button" tabindex="0"><div><div class="t">Hidden items: ${n}</div><div class="s">Cards and branches you chose never to see again. Tap to bring them all back.</div></div></div>`:""})()}
   <div class="li tap" id="rst" role="button" tabindex="0"><div><div class="t" style="color:var(--coral)">Reset progress</div><div class="s">Clears every answer saved on this device</div></div></div></div>`;
  wireGear(V);$("#st").onclick=openSettings;$("#exd").onclick=openExamDate;
  if($("#unhide"))$("#unhide").onclick=()=>{P.retired={};Object.values(P.tn).forEach(s=>{if(s.retired){delete s.retired;s.due=now()}});saveP();toast("Hidden items are back");go("me")};
  let armed=0;$("#rst").onclick=()=>{if(now()-armed>3000){armed=now();return toast("Tap again to reset all progress")}["box","due","seen","right","wrong","last","tn","retired"].forEach(k=>P[k]={});P.sessions=[];saveP();toast("Progress reset");go("me")}}

/* settings */
function openSettings(){
  const seg=(k,o)=>`<div class="seg" data-k="${k}">${o.map(([v,n])=>`<button data-v="${v}" class="${String(CFG[k])===String(v)?"on":""}">${n}</button>`).join("")}</div>`;
  const tg=(k,t,d)=>`<div class="sw" data-k="${k}" role="switch" aria-checked="${!!CFG[k]}" tabindex="0"><span>${t}<small>${d}</small></span><span class="tg${CFG[k]?" on":""}"></span></div>`;
  const sh=sheet({title:"Settings",body:`
   <div class="field"><div class="lab">Exam</div>${seg("step",[["1","Step 1"],["2","Step 2 CK"]])}<p class="lede" style="font-size:.82rem;margin-top:.4rem">Step 1 hides treatment and management branches. Step 2 CK shows everything, marked "Step 2".</p></div>
   <div class="field"><div class="lab">Theme</div>${seg("theme",[["auto","Match device"],["day","Day"],["night","Night"],["sepia","Sepia"]])}</div>
   <div class="field"><div class="lab">Text size: <span id="scv">${Math.round(CFG.scale*100)}%</span></div><input id="sc" type="range" min="0.9" max="1.4" step="0.05" value="${CFG.scale}" aria-label="Text size">
     <div class="preview">A 72-year-old woman has chest pain on exertion 5 months after a coronary stent.</div></div>
   <div class="field"><div class="lab">Case style</div>${seg("short",[["false","Full case"],["true","One-liner (72F + … → ?)"]])}</div>
   <div class="field"><div class="lab">Reading font</div>${seg("font",[["serif","Serif"],["sans","Sans"],["easy","Easy to read"]])}</div>
   <div class="field"><div class="lab">Animations</div>${seg("motion",[["full","Full"],["reduced","Reduced"],["off","Off"]])}</div>
   <div class="field"><div class="lab">Studying</div>
     ${tg("opts","Answer options","Off: say the answer, reveal it and mark yourself")}
     ${tg("direct","Show options straight away","Off: say how sure you are before the options appear")}
     ${tg("traps","Look-alike options","Off: use the original exam options")}
     ${tg("hl","Highlight key clues","Underlines the words that point to the answer")}
     ${tg("hints","Hints","Shows a hint button on cards that have one")}
     ${tg("haptics","Vibrate on answer","On phones that support it")}</div>
   <div class="field keys"><div class="lab">Keyboard</div><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> how sure, <kbd>A</kbd> to <kbd>E</kbd> answer, <kbd>H</kbd> hint, <kbd>Enter</kbd> next, <kbd>F</kbd> flip, <kbd>Esc</kbd> close. Zoom with <kbd>Ctrl</kbd> or <kbd>⌘</kbd> and <kbd>+</kbd> or <kbd>−</kbd>.</div>`,
   onClose:()=>{if(view!=="player")go(view)}});
  keyClick(sh);
  $$(".seg[data-k]",sh).forEach(g=>$$("button",g).forEach(b=>b.onclick=()=>{CFG[g.dataset.k]=g.dataset.k==="short"?b.dataset.v==="true":b.dataset.v;if(g.dataset.k==="short"&&view==="player"&&RUN)go("player");if(g.dataset.k==="step"){drawTabs();if(view==="tree"&&TRUN)go("tree")}saveCfg();applyCfg();$$("button",g).forEach(x=>x.classList.toggle("on",x===b))}));
  $("#sc",sh).oninput=e=>{CFG.scale=+e.target.value;$("#scv",sh).textContent=Math.round(CFG.scale*100)+"%";applyCfg();saveCfg()};
  $$(".sw",sh).forEach(r=>r.onclick=()=>{const k=r.dataset.k;CFG[k]=!CFG[k];saveCfg();$(".tg",r).classList.toggle("on",CFG[k]);r.setAttribute("aria-checked",CFG[k]);if(view==="player"&&RUN&&["hl","traps","opts","direct"].includes(k))go("player")})}

/* keyboard */
addEventListener("keydown",e=>{const k=e.key.toLowerCase();
  if(k==="escape"){if(sheetOpen)return closeSheet();if(view==="player"&&RUN)return end();if(view==="tree"){TRUN=null;return go("practice")}}
  if(e.target.matches("input,textarea"))return;
  if(!sheetOpen&&view==="tree"&&TRUN&&(e.key===" "||e.key==="Enter")&&!e.target.closest("button")){e.preventDefault();const v=$(".tnode.now .veil");if(v)v.click();else $(".tnode.now .tself .go")?.click();return}
  if(sheetOpen||view!=="player"||!RUN)return;
  if(k==="h"&&ph!=="done"){showHint();return}
  if(["1","2","3"].includes(k)&&(ph==="rate"||(ph==="options"&&RUN.mode!=="rapid"))){const c=["sure","unsure","guess"][+k-1];if(ph==="rate"){conf=c;ph=CFG.opts?"options":"reveal";stage()}else{conf=c;$$("[data-cf]").forEach(x=>x.classList.toggle("on",x.dataset.cf===c))}return}
  if(ph==="reveal"){if(k==="y")selfGrade(true);else if(k==="n")selfGrade(false)}
  else if(ph==="options"){const L=e.key.toUpperCase();if(OPT(RUN.q[RUN.pos]).o[L])pick(L)}
  else if(ph==="done"){if(e.key==="Enter"||e.key===" "){e.preventDefault();next()}else if(k==="f")$("#flip")?.click()}});

drawTabs();go("today");
})();
</script>
